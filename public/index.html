 ap();lab();

 r.onclick=async e=>{const a=e.target.closest('button')&&e.target.closest('button').dataset.a;if(!a)return;

/* admin */
function parse(t){return t.split(/^═+.*লেখা.*═+\s*$/m).map(s=>s.trim()).filter(Boolean).map((b,i)=>{const L=b.split('\n'),g=k=>((L.find(l=>l.startsWith(k+':'))||'').split(':').slice(1).join(':')).trim();
 let k=L.findIndex(l=>/^শব্দ:/.test(l));if(k<0)k=L.findIndex(l=>/^শিরোনাম:/.test(l));
 return{n:i+1,author:g('লেখক'),title:g('শিরোনাম'),topic:((L.find(l=>/^দিন\s*\d+/.test(l))||'').split('—')[1]||'').trim(),body:L.slice(k+1).join('\n').trim()}})}
