<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0B1026">
<title>শব্দের আলোয় সেরার নির্বাচন</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;600;700&family=Noto+Serif+Bengali:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1026;--pur:#36205D;--lav:#A78BFA;--gold:#E8C58A;--ivory:#FFF9F0;--serif:'Noto Serif Bengali',serif;--sans:'Hind Siliguri',sans-serif}
html{scroll-behavior:smooth}
body{background:var(--navy);color:var(--ivory);font-family:var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:-20%;z-index:-2;background:radial-gradient(40% 35% at 20% 20%,rgba(167,139,250,.35),transparent 70%),radial-gradient(45% 40% at 80% 30%,rgba(54,32,93,.9),transparent 70%),radial-gradient(40% 40% at 50% 90%,rgba(232,197,138,.14),transparent 70%);animation:aur 18s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(4%,3%) rotate(6deg) scale(1.1)}}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
button{font-family:inherit;cursor:pointer;border:0}
.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(232,197,138,.28);border-radius:20px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:40px;font-weight:700;font-size:16px;background:linear-gradient(135deg,#b98a3a,#E8C58A 50%,#b98a3a);background-size:200%;color:#2a1a05;box-shadow:0 0 30px rgba(232,197,138,.35);transition:.3s}
.btn:hover{background-position:100%;transform:translateY(-2px) scale(1.02)}
.btn.o{background:transparent;color:var(--gold);border:1px solid rgba(232,197,138,.5);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(11,16,38,.55);backdrop-filter:blur(14px);border-bottom:1px solid rgba(232,197,138,.15)}
nav b{font-family:var(--serif);color:var(--gold);font-size:15px}
nav button{padding:8px 16px;border-radius:30px;background:rgba(232,197,138,.14);color:var(--gold);border:1px solid rgba(232,197,138,.4);font-size:13px}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 20px 50px;gap:18px;position:relative}
.tag{padding:6px 18px;border-radius:30px;font-size:13px;color:var(--gold);border:1px solid rgba(232,197,138,.5);background:rgba(232,197,138,.08);box-shadow:0 0 24px rgba(232,197,138,.25);animation:glow 3s infinite alternate}
@keyframes glow{to{box-shadow:0 0 40px rgba(232,197,138,.55)}}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(38px,9vw,84px);line-height:1.25;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 60px rgba(167,139,250,.4)}
h1 span{display:block;opacity:0;transform:translateY(30px);animation:up .9s forwards}h1 span+span{animation-delay:.25s}
@keyframes up{to{opacity:1;transform:none}}
.sub{font-size:clamp(15px,3.6vw,20px);opacity:.88;max-width:560px}
.book{width:150px;animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(232,197,138,.6))}
@keyframes fl{50%{transform:translateY(-14px)}}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stats div{padding:12px 20px;min-width:118px}.stats b{display:block;font-family:var(--serif);font-size:22px;color:var(--gold)}.stats small{font-size:12px;opacity:.8}
.scr{position:absolute;bottom:18px;width:22px;height:36px;border:2px solid rgba(232,197,138,.6);border-radius:14px}
.scr::after{content:'';position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--gold);animation:sc 1.6s infinite}
@keyframes sc{60%{transform:translateY(12px);opacity:0}}
.sec{padding:70px 18px 90px;max-width:1180px;margin:0 auto}
.sec h2{font-family:var(--serif);text-align:center;font-size:clamp(26px,6vw,40px);color:var(--gold);margin-bottom:8px}
.sec>p{text-align:center;opacity:.8;margin-bottom:38px}
#gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;perspective:1000px}
.card{position:relative;border-radius:8px 18px 18px 8px;padding:0 0 20px;background:linear-gradient(160deg,#3a2866,#1a1236);border:1px solid rgba(232,197,138,.45);box-shadow:-6px 0 0 #1a1236,-7px 0 0 rgba(232,197,138,.4),0 24px 50px -18px rgba(0,0,0,.8),0 0 40px -12px rgba(167,139,250,.5);overflow:hidden;transition:transform .25s,box-shadow .3s;transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));opacity:0;translate:0 40px}
.card.in{opacity:1;translate:0 0;transition:opacity .8s var(--d),translate .8s var(--d),transform .25s}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--a,0deg),transparent,var(--gold),transparent 30%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.3s;pointer-events:none}
.card:hover::before{opacity:1;animation:sp 3s linear infinite}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes sp{to{--a:360deg}}
.card:hover{box-shadow:-6px 0 0 #1a1236,0 30px 60px -16px rgba(0,0,0,.9),0 0 50px rgba(232,197,138,.4)}
.art{height:130px;overflow:hidden}.art svg{width:100%;height:100%;transition:transform .8s}.card:hover .art svg{transform:scale(1.12) translateX(-3%)}
.no{position:absolute;top:12px;left:12px;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:rgba(11,16,38,.7);border:1px solid var(--gold);color:var(--gold);font-family:var(--serif);font-weight:700}
.card h3{font-family:var(--serif);font-size:20px;line-height:1.5;padding:16px 18px 0;min-height:98px;transition:.3s}
.card:hover h3{text-shadow:0 0 18px rgba(232,197,138,.7);color:#fff}
.ln{display:block;height:2px;margin:6px 18px 10px;width:60px;background:linear-gradient(90deg,var(--gold),transparent)}
.card p{padding:0 18px;font-size:14px;line-height:1.8;opacity:.8;height:78px;overflow:hidden}
.gb{margin:14px 18px 0;padding:10px 16px;border-radius:30px;background:rgba(232,197,138,.14);color:var(--gold);border:1px solid rgba(232,197,138,.5);font-weight:600;width:calc(100% - 36px);transition:.3s}
.gb:hover{background:var(--gold);color:#2a1a05}
.rd{position:fixed;inset:0;z-index:40;background:rgba(5,8,24,.92);overflow-y:auto;animation:op .6s cubic-bezier(.2,.8,.2,1)}
@keyframes op{from{opacity:0;transform:perspective(900px) rotateY(-25deg) scale(.9)}}
.pg{position:fixed;top:0;left:0;height:4px;width:0;z-index:50;background:linear-gradient(90deg,var(--lav),var(--gold))}
.paper{max-width:760px;margin:70px auto 40px;padding:44px clamp(20px,5vw,56px);background:var(--ivory);color:#2a2036;border-radius:6px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.7);background-image:radial-gradient(rgba(120,90,40,.06) 1px,transparent 1px);background-size:6px 6px}
.paper::before,.paper::after{content:'❖';position:absolute;color:#b98a3a;font-size:22px}.paper::before{top:12px;left:16px}.paper::after{bottom:12px;right:16px}
.paper .nn{text-align:center;color:#b98a3a;font-family:var(--serif);font-weight:700;letter-spacing:2px}
.paper h2{font-family:var(--serif);text-align:center;font-size:clamp(24px,5.5vw,34px);line-height:1.5;color:#36205D;margin:6px 0 4px}
.paper .dv{text-align:center;color:#b98a3a;margin:10px 0 26px;letter-spacing:8px}
.txt{font-family:var(--serif);font-size:clamp(17px,4.2vw,19px);line-height:2.1;white-space:pre-wrap;unicode-bidi:plaintext;word-break:break-word}
.txt::first-letter{font-size:2.4em;color:#b98a3a;font-weight:800;float:left;line-height:1;margin:6px 8px 0 0}
.rb{position:fixed;top:0;left:0;right:0;z-index:45;display:flex;justify-content:space-between;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(11,16,38,.85);backdrop-filter:blur(10px);margin-top:4px}
.rb button{padding:8px 14px;border-radius:30px;background:rgba(232,197,138,.12);color:var(--gold);border:1px solid rgba(232,197,138,.4);font-size:13px}
.sel{position:sticky;bottom:14px;display:flex;justify-content:center;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.mo{position:fixed;inset:0;z-index:60;background:rgba(5,8,24,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:up .3s}
.mb{max-width:420px;width:100%;padding:28px 24px;text-align:center}
.mb h3{font-family:var(--serif);color:var(--gold);font-size:22px;margin-bottom:10px}
.mb p{opacity:.9;line-height:1.8;margin-bottom:16px}
.mb input,.in2{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(232,197,138,.5);background:rgba(255,255,255,.08);color:#fff;font-size:18px;text-align:center;letter-spacing:3px;outline:none;font-family:inherit;margin-bottom:12px}
.mb .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.err{color:#ff9aa8;font-size:13px;min-height:20px;margin-bottom:6px}
.pick{padding:12px;border-radius:12px;background:rgba(232,197,138,.12);border:1px solid var(--gold);font-family:var(--serif);margin-bottom:18px}
.bal{position:fixed;inset:0;z-index:70;background:radial-gradient(circle,#2a1a55,#070a1c);display:grid;place-items:center;text-align:center;padding:20px}
.bx{position:relative;width:200px;height:150px;margin:0 auto}
.bx .box{position:absolute;bottom:0;left:0;right:0;height:100px;border-radius:10px;background:linear-gradient(160deg,#6d3fc0,#36205D);border:2px solid var(--gold);box-shadow:0 0 40px rgba(232,197,138,.4)}
.bx .slot{position:absolute;bottom:92px;left:30px;right:30px;height:10px;border-radius:5px;background:#0B1026;border:2px solid var(--gold);z-index:3}
.ballot{position:absolute;left:62px;top:-90px;width:76px;height:98px;border-radius:8px;background:var(--ivory);z-index:2;display:grid;place-items:center;font-size:40px;color:#36205D;box-shadow:0 0 30px var(--gold);animation:bl 2.3s ease-in forwards}
@keyframes bl{0%{transform:translateY(-60px) scale(.6);opacity:0}25%{opacity:1;transform:translateY(0) scale(1) rotate(-6deg)}50%{transform:translateY(20px) rotate(5deg)}100%{transform:translateY(115px) scale(.9);opacity:.95}}
.bx::after{content:'';position:absolute;left:50%;top:60%;width:20px;height:20px;border-radius:50%;margin:-10px;background:radial-gradient(#fff3c8,rgba(232,197,138,.6),transparent 70%);opacity:0;animation:fl2 1.2s 2.2s forwards}
@keyframes fl2{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(26)}}
.msg{opacity:0;transform:translateY(16px);transition:1s;margin-top:24px}.ok .msg{opacity:1;transform:none}.ok .ballot{display:none}
.msg h2{font-family:var(--serif);font-size:clamp(32px,8vw,52px);color:var(--gold);margin-bottom:10px;text-shadow:0 0 30px rgba(232,197,138,.6)}
.gp{position:fixed;z-index:80;pointer-events:none;color:var(--gold);animation:fly 1.4s ease-out forwards}
@keyframes fly{from{opacity:1}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;background:#1a1236;border:1px solid var(--gold);padding:12px 22px;border-radius:30px;font-size:14px;max-width:90%;text-align:center}
.ad{max-width:820px;margin:0 auto;padding:30px 16px 80px;font-family:var(--sans)}.ad h2{font-family:var(--serif);color:var(--gold);margin:6px 0 14px}.ad .glass{padding:18px;margin-bottom:16px}
.ad textarea{width:100%;min-height:130px;border-radius:10px;padding:10px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(232,197,138,.4);font-family:inherit}
.ad .in2{letter-spacing:0;font-size:15px;text-align:left}.ad table{width:100%;border-collapse:collapse;font-size:14px}.ad td,.ad th{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}
.bar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--lav),var(--gold));min-width:2px}.ad code{background:rgba(232,197,138,.15);padding:2px 8px;border-radius:6px;color:var(--gold);letter-spacing:1px}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

.card.on{box-shadow:-6px 0 0 #1a1236,0 0 0 2px var(--gold),0 0 60px rgba(232,197,138,.55)}
.card .vb{display:block;margin:10px 18px 0;width:calc(100% - 36px);padding:10px 14px;border-radius:30px;background:transparent;color:var(--ivory);border:1px dashed rgba(232,197,138,.6);font-weight:600;transition:.3s}
.card.on .vb{background:var(--gold);color:#2a1a05;border-style:solid}.card.done .vb{display:none}
.badge{position:absolute;top:12px;right:12px;z-index:2;padding:4px 10px;border-radius:20px;background:var(--gold);color:#2a1a05;font-size:12px;font-weight:700;transform:scale(0);transition:.35s cubic-bezier(.3,1.6,.5,1)}.card.on .badge{transform:scale(1)}
.vbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,170%);z-index:30;width:min(94vw,520px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;transition:transform .5s cubic-bezier(.2,.9,.3,1)}.vbar.show{transform:translate(-50%,0)}
.dots{display:flex;gap:8px}.dots i{width:18px;height:18px;border-radius:50%;border:2px solid rgba(232,197,138,.6);transition:.4s}.dots i.f{background:radial-gradient(#fff3c8,var(--gold));box-shadow:0 0 14px var(--gold);transform:scale(1.15)}
.rb button{padding:8px 10px}
.txt{font-size:var(--fs,19px)}.txt::first-letter{float:none;font-size:inherit;color:inherit;margin:0;line-height:inherit;font-weight:inherit}
.txt p{margin:0 0 .7em}.txt p.ar{font-family:'Amiri',serif;font-size:1.3em;text-align:center;line-height:2.2;margin:.6em 0}
.txt p.dc::first-letter{font-size:2.4em;color:#b98a3a;font-weight:800;float:left;line-height:1;margin:6px 8px 0 0}.sp{height:.8em}
.by{padding:0 18px 8px;font-size:13px;color:var(--gold);opacity:.95}.by2{text-align:center;color:#8a6a2a;font-size:15px;margin-bottom:4px}
.paper.dk{background:#15152e;color:#eee6d6}.paper.dk h2{color:var(--gold)}

(()=>{
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,FINE=matchMedia('(hover:hover) and (pointer:fine)').matches,Q=(s,e=document)=>e.querySelector(s);
const BOOK='<div class="book" aria-hidden="true"><i class="bkg"></i><div class="bk"><div class="bki"><i class="bkr"></i><i class="bkl bkl2"></i><i class="bkl bkl1"></i><div class="bkc"><i class="bkcf"></i><i class="bkcb"></i></div></div></div></div>';
const io=(!RM&&'IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('sh');io.unobserve(e.target)}}),{threshold:.2,rootMargin:'0px 0px -8% 0px'}):null;
let mo=null;
function enh(){try{
 const o=Q('.hero svg.book');
 if(o){const d=document.createElement('div');d.innerHTML=BOOK;o.replaceWith(d.firstElementChild)}
 const hs=document.querySelectorAll('.sec h2,.sec>p');
 hs.forEach(el=>{if(el.dataset.rv)return;el.dataset.rv=1;if(io){el.classList.add('rv');io.observe(el)}});
 if((o||Q('.hero .book'))&&hs.length&&mo){mo.disconnect();mo=null}
}catch(e){}}
enh();
const app=Q('#app');if(app&&(!Q('.hero .book')||!Q('.sec h2'))){mo=new MutationObserver(enh);mo.observe(app,{childList:true,subtree:true})}
/* ম্যাগনেটিক + রিপল */
if(FINE&&!RM){let cur=null;const rs=b=>{b.style.setProperty('--mx','0px');b.style.setProperty('--my','0px')};
 document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const b=e.target.closest&&e.target.closest('.btn,.gb,nav button');
  if(cur&&cur!==b){rs(cur);cur=null}if(!b||b.disabled)return;cur=b;const r=b.getBoundingClientRect(),
  c=(v,m)=>Math.max(-m,Math.min(m,v));b.style.setProperty('--mx',c((e.clientX-r.left-r.width/2)*.22,9)+'px');b.style.setProperty('--my',c((e.clientY-r.top-r.height/2)*.3,7)+'px')},{passive:true});
 document.documentElement.addEventListener('mouseleave',()=>{if(cur){rs(cur);cur=null}})}
document.addEventListener('pointerdown',e=>{if(RM)return;const b=e.target.closest&&e.target.closest('.btn,.gb,.vb,nav button,.rb button');if(!b||b.disabled)return;
 const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='rip';
 s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);
 s.addEventListener('animationend',()=>s.remove());setTimeout(()=>s.remove(),900)},{passive:true});
/* মাউস অনুসরণ নরম আলো */
if(FINE&&!RM){const g=document.createElement('div');g.id='mg';document.body.appendChild(g);let tx=0,ty=0,x=0,y=0,on=false,raf=0;
 const tick=()=>{x+=(tx-x)*.14;y+=(ty-y)*.14;g.style.transform=`translate3d(${x}px,${y}px,0)`;raf=(Math.abs(tx-x)+Math.abs(ty-y)>.5)?requestAnimationFrame(tick):0};
 addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;tx=e.clientX;ty=e.clientY;if(!on){on=true;g.style.opacity=1;x=tx;y=ty}if(!raf)raf=requestAnimationFrame(tick)},{passive:true});
 document.documentElement.addEventListener('mouseleave',()=>{on=false;g.style.opacity=0})}
/* হালকা প্যারালাক্স */
if(!RM){const geo=Q('#geo');let q=0;
 const par=()=>{q=0;const y=scrollY;if(geo)geo.style.transform=`translate3d(0,${-Math.min(innerHeight*.07,y*.035)}px,0)`;
  if(y<innerHeight*1.2){const b=Q('.hero .book'),h=Q('.hero h1');if(b)b.style.translate=`0 ${y*.1}px`;if(h)h.style.translate=`0 ${y*.05}px`}};
 addEventListener('scroll',()=>{if(!q)q=requestAnimationFrame(par)},{passive:true})}
})();
</script></body></html>
